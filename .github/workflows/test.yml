name: Run tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        otp-version: [25.3.2.31, 26.2.5.2, 27.0.1]
    name: Test on OTP ${{ matrix.otp-version }} (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: OTP-${{ matrix.otp-version }}
          rebar3-version: 3.23.0
      - name: Compile
        run: make compile
      - name: Run tests
        run: make test
  test-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        otp-version: [25.3.2.31, 26.2.5.2, 27.0.1]
    name: Test on OTP ${{ matrix.otp-version }} (windows-2022)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: OTP-${{ matrix.otp-version }}
          rebar3-version: 3.23.0
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: git
            make
            mingw-w64-x86_64-gcc
      - name: Setup PATH
        run: PATH=$(cygpath ${{ vars.INSTALL_DIR_FOR_OTP }}):$(cygpath ${{ vars.INSTALL_DIR_FOR_REBAR3 }}):$PATH
      - name: Compile
        run: make compile
      - name: Run tests
        run: make test
